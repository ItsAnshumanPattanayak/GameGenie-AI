[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "gamegenie-backend"
version = "1.0.0"
description = "FastAPI catalogue backend for GameGenie AI"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1.0",
  "uvicorn[standard]>=0.35,<1.0",
  "pydantic>=2.11,<3.0",
  "pydantic-settings>=2.10,<3.0",
  "numpy>=2.1,<2.4",
  "sentence-transformers>=5.0,<6.0",
]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1.0", "pytest>=8.4,<10.0", "pytest-cov>=6.2,<8.0", "ruff>=0.12,<1.0", "mypy>=1.17,<2.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
exclude = ["build/"]
